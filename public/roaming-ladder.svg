<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="cyan2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="colShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrCyanR" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71717a"/>
    </marker>
    <marker id="arrGrayR" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#71717a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="820" rx="16" fill="url(#bg2)"/>

  <!-- Column headers -->
  <rect x="40" y="20" width="220" height="48" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="150" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fafafa">STA</text>

  <rect x="340" y="20" width="220" height="48" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <rect x="340" y="20" width="220" height="48" rx="10" fill="#22d3ee" fill-opacity="0.06"/>
  <text x="450" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fafafa">AP-A (serving)</text>

  <rect x="640" y="20" width="220" height="48" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <rect x="640" y="20" width="220" height="48" rx="10" fill="#22d3ee" fill-opacity="0.06"/>
  <text x="750" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fafafa">AP-B (peer)</text>

  <!-- Lifelines -->
  <line x1="150" y1="68" x2="150" y2="800" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="450" y1="68" x2="450" y2="800" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="750" y1="68" x2="750" y2="800" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Step 1: Association -->
  <circle cx="20" cy="110" r="12" fill="url(#cyan2)"/>
  <text x="20" y="114" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#09090b">1</text>
  <line x1="150" y1="110" x2="430" y2="110" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <text x="290" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fafafa">Association</text>
  <text x="290" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a1a1aa">good signal (−55 dBm)</text>
  <text x="450" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#52525b">Activity + Roam Table init</text>

  <!-- Step 2: RSSI drops -->
  <circle cx="20" cy="185" r="12" fill="url(#cyan2)"/>
  <text x="20" y="189" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#09090b">2</text>
  <line x1="150" y1="185" x2="430" y2="185" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <text x="290" y="177" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fafafa">RSSI drops</text>
  <text x="290" y="201" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a1a1aa">weak RSSI reported</text>
  <text x="450" y="201" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#52525b">probe countdown starts</text>

  <!-- Step 3: PROBE_REQ -->
  <circle cx="20" cy="280" r="12" fill="url(#cyan2)"/>
  <text x="20" y="284" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#09090b">3</text>
  <line x1="450" y1="280" x2="730" y2="280" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <text x="590" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fafafa">PROBE_REQ</text>
  <text x="590" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a1a1aa">multicast 239.1.1.100</text>
  <text x="450" y="264" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#52525b">Countdown → 0</text>

  <!-- Step 4: Peer evaluates -->
  <circle cx="20" cy="355" r="12" fill="url(#cyan2)"/>
  <text x="20" y="359" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#09090b">4</text>
  <rect x="660" y="338" width="180" height="36" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="750" y="354" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a1a1aa">SSID ✓  known ✓</text>
  <text x="750" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a1a1aa">recency ✓  margin ✓</text>
  <text x="750" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#52525b">Peer evaluates</text>

  <!-- Step 5: PROBE_RESP -->
  <circle cx="20" cy="430" r="12" fill="url(#cyan2)"/>
  <text x="20" y="434" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#09090b">5</text>
  <line x1="730" y1="430" x2="470" y2="430" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyanR)"/>
  <text x="600" y="422" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fafafa">PROBE_RESP</text>
  <text x="600" y="446" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a1a1aa">unicast, best RSSI</text>

  <!-- Step 6: Candidate window -->
  <circle cx="20" cy="505" r="12" fill="url(#cyan2)"/>
  <text x="20" y="509" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#09090b">6</text>
  <rect x="360" y="488" width="180" height="36" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="450" y="504" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a1a1aa">Candidate window closes</text>
  <text x="450" y="518" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#52525b">2 seconds</text>

  <!-- Step 7+8: BTM -->
  <circle cx="20" cy="590" r="12" fill="url(#cyan2)"/>
  <text x="20" y="594" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#09090b">7</text>
  <circle cx="20" cy="630" r="12" fill="url(#cyan2)"/>
  <text x="20" y="634" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#09090b">8</text>
  <line x1="430" y1="610" x2="170" y2="610" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyanR)"/>
  <text x="300" y="602" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fafafa">BTM Request</text>
  <text x="300" y="626" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a1a1aa">Neighbor Report IE</text>
  <text x="450" y="582" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#52525b">Build BTM frame</text>

  <!-- Step 9: Client roams -->
  <circle cx="20" cy="700" r="12" fill="url(#cyan2)"/>
  <text x="20" y="704" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#09090b">9</text>
  <line x1="150" y1="700" x2="730" y2="700" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <text x="440" y="692" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fafafa">Client roams</text>
  <text x="440" y="716" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a1a1aa">assoc + 4-way handshake (70–85 ms)</text>

  <!-- Step 10: First data -->
  <circle cx="20" cy="770" r="12" fill="url(#cyan2)"/>
  <text x="20" y="774" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#09090b">10</text>
  <line x1="730" y1="770" x2="170" y2="770" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrCyanR)"/>
  <text x="450" y="762" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fafafa">First data packet</text>
  <text x="450" y="786" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a1a1aa">120–130 ms total</text>
</svg>
